name: Build Lucky Block Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find . -type d \( -name .git -o -name .gradle -o -name build \) -prune -o -type f \( -name build.gradle -o -name build.gradle.kts \) -print | sort)
          if (( ${#candidates[@]} == 0 )); then
            echo 'ERROR: No build.gradle or build.gradle.kts was found in the checked-out repository.'
            echo 'Upload/extract the MOD SOURCE files, not just the ZIP file or the workflow.'
            echo 'Expected at least: build.gradle, settings.gradle, gradle.properties, and src/.'
            echo 'Visible non-git files:'
            find . -type d -name .git -prune -o -type f -print | sort | head -100
            exit 1
          fi
          if (( ${#candidates[@]} > 1 )); then
            echo 'Found more than one Gradle project; using the first sorted build file:'
            printf '  %s\n' "${candidates[@]}"
          fi
          build_file="${candidates[0]}"
          project_dir="$(dirname "$build_file")"
          project_dir="${project_dir#./}"
          [[ "$project_dir" == "$build_file" ]] && project_dir='.'
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Building project at: $project_dir"

      - name: Build mod
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: luckyblockmod-forge-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
